[workspace]
resolver = "2"
members = ["crates/emrs-core", "crates/emrs-server"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"

[workspace.dependencies]
emrs-core = { path = "crates/emrs-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "local-time"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "mysql", "postgres", "any", "migrate", "chrono", "derive", "macros"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
moka = { version = "0.12", features = ["future"] }
config = "0.14"
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
rand = "0.8"
sha2 = "0.10"
axum = "0.8"
http = "1"
tower = { version = "0.5", features = ["limit", "timeout", "load-shed", "util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "compression-gzip", "set-header", "fs", "catch-panic", "timeout"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4", features = ["derive"] }
aes-gcm = "0.10"
base64 = "0.22"
jsonwebtoken = "9"
notify = "8"
dashmap = "6"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
filetime = "0.2"
serde_yaml = "0.9"
rust-embed = "8"
regex = "1"
quick-xml = "0.36"
tracing-appender = "0.2"
time = { version = "0.3", features = ["macros", "local-offset"] }
ffmpeg-sidecar = { version = "2", features = ["download_ffmpeg"] }
listen_port = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
