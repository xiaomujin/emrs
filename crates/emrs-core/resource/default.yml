# EMRS 默认配置 — 首次启动时自动生成，修改后重启生效。
# 密钥类字段（playback.signing_key、tmdb.api_key）
# 一律从本配置文件读取，不读取环境变量。

server:
  # 监听端口
  port: 8086

storage:
  # 数据库 DSN（sqlite/mysql/postgres）
  dsn: "sqlite://data/emrs.db?mode=rwc"
  max_connections: 8

cache:
  # 缓存后端：memory | redis | valkey
  backend: "memory"
  # redis/valkey 时必填，memory 时忽略
  # url: "redis://127.0.0.1:6379"
  default_ttl_secs: 3600

emby:
  server_id: "EMRS"
  server_name: "EMRS"
  api_key: "EMRS_KEY"

playback:
  # 播放票据签名密钥（必填，否则无法签发播放票据 /s/{ticket}）。从本文件读取。
  signing_key: "emrs_signing_key"
  ticket_ttl_secs: 3600
  redirect_cache_ttl_secs: 10800
  # strm/http 直链播放期缺流信息时异步 ffprobe 回填（当前请求不阻塞，
  # 同条目下次请求即有完整流信息/时长）。
  strm_probe_backfill: true
  # 单次 strm 后台 ffprobe 探测超时（秒），远端 URL 挂起时兜底。
  strm_probe_timeout_secs: 30

cloud:
  # 启用的 driver 列表（当前仅 http 直链 302）
  drivers:
    - "http"

tmdb:
  # TMDB v3 API key 或 v4 Bearer token（以 eyJ 开头自动识别）。为空则刮削静默跳过。
  # 从本文件读取。请求限速由 pipeline.scrape_rate_limit_per_sec 控制。
  api_key: ""

http:
  # 外部请求代理地址（TMDB API、剧照下载均走此代理）。为空则直连。
  # 如 http://127.0.0.1:7890
  # proxy_url: ""
  # —— 自定义 DNS / hosts 覆盖（TMDB 被墙时替代代理的另一条路线）——
  # 用 hosts 时建议把上面 proxy_url 留空（走代理的请求不应用本地 hosts）。
  # 来源优先级：内联 hosts_inline > 远程 hosts_url > 本地 hosts_file；三者可并存，启动时加载一次。
  # 远程 hosts 拉取地址（可配置），成功后缓存到 hosts_file，失败回退 hosts_file。留空=不联网。
  hosts_url: "https://gh-proxy.com/https://raw.githubusercontent.com/cnwikee/CheckTMDB/refs/heads/main/Tmdb_host_ipv4"
  # 本地 hosts 文件（远程缓存落点，也可手写离线 hosts）。
  hosts_file: "data/tmdb_hosts.txt"
  # 内联 hosts 行（每行 "IP host"，同名覆盖上面来源）。
  # hosts_inline:
  #   - "3.170.19.19 api.tmdb.org"
  #   - "143.244.60.195 image.tmdb.org"
  # 是否本机代理获取图片（/Items/{id}/Images）。
  # false（默认）：301 重定向到图片原始 URL，客户端直连上游，省本机带宽；
  #   重定向模式下 maxWidth/maxHeight/quality 缩放参数不生效。
  # true：本机下载后返回（客户端访问不了图源、或需要缩放时开启，可配合上面 proxy/hosts）。
  image_proxy: false

# 四阶段流水线（Scan → Probe → Scrape 后台轮询）：
#   Scan 落物理事实 → Probe 消费 media_source(status='pending') 回填流信息
#   → Scrape 消费 item(scrape_status='pending') 匹配 TMDB 回填元数据
pipeline:
  # 是否启动后台流水线轮询
  enabled: true
  # probe 并发度（同时在飞的 ffprobe 进程数上限）
  probe_concurrency: 2
  # scrape 单批消费条数
  scrape_concurrency: 4
  # 各阶段 DB 轮询间隔（秒）
  poll_interval_secs: 10
  # 刮削失败最大尝试次数，超过转 failed 终态；网络/API 异常按 attempts 重试
  scrape_retry_max_attempts: 5
  # TMDB 全局限速（次/秒，进程级共享；0 不限速）
  scrape_rate_limit_per_sec: 20
  # 删除检测兜底间隔（秒）；每次扫描完成后必触发一次
  delete_check_interval_secs: 3600
  # —— sqlite 写库节流（仅 WAL 生效；大库首扫时避免扫描/探测长时间独占写锁饿死认证/读）——
  # 扫描每处理 N 个媒体文件让出一次写锁（0 关闭）
  scan_yield_every_files: 200
  # 扫描每让出一次的休眠毫秒
  scan_yield_ms: 50
  # probe 每批之间让出写锁的毫秒（0 关闭）
  probe_yield_ms: 20
