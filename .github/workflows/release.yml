name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v0.1.0），手动触发时用于命名 Release 与产物'
        required: true
        default: 'dev'

permissions:
  contents: write

env:
  IMAGE_NAME: emrs

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  # ---------- 二进制包 ----------
  binaries:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: emrs-${{ needs.meta.outputs.tag }}-x86_64-unknown-linux-musl
            bin: emrs-server
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: emrs-${{ needs.meta.outputs.tag }}-x86_64-pc-windows-msvc.exe
            bin: emrs-server.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p emrs-server --target ${{ matrix.target }}

      - name: Rename binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mv "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.artifact }}"

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Move-Item "target\${{ matrix.target }}\release\${{ matrix.bin }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: bins-${{ matrix.target }}
          path: ${{ matrix.artifact }}

  # ---------- Docker 镜像包 ----------
  docker:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute image refs
        id: refs
        run: |
          raw="${{ needs.meta.outputs.tag }}"   # 如 v0.1.0 / dev
          ver="${raw#v}"                        # 去前缀 v 作语义化标签
          hub="${{ secrets.DOCKERHUB_USERNAME }}"
          # 本地标签（供 docker save 导出 Release 附件）始终存在
          tags="emrs:${raw}"
          push="false"
          if [ -n "$hub" ]; then
            push="true"
            tags="$tags,$hub/${{ env.IMAGE_NAME }}:$ver"
            # 仅正式 tag 触发时更新 latest，手动 dev 试跑不动 latest
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              tags="$tags,$hub/${{ env.IMAGE_NAME }}:latest"
            fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "local=emrs:${raw}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ steps.refs.outputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: ${{ steps.refs.outputs.push }}
          tags: ${{ steps.refs.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image to tar.gz
        run: |
          out="${{ env.IMAGE_NAME }}-${{ needs.meta.outputs.tag }}-docker.tar.gz"
          docker save "${{ steps.refs.outputs.local }}" | gzip > "$out"
          ls -lh "$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: docker-image
          path: ${{ env.IMAGE_NAME }}-${{ needs.meta.outputs.tag }}-docker.tar.gz

  # ---------- 汇总发布 ----------
  release:
    needs: [meta, binaries, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: bins-*
          path: dist
          merge-multiple: true

      - name: Download docker image artifact
        uses: actions/download-artifact@v5
        with:
          name: docker-image
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Release ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: dist/*
